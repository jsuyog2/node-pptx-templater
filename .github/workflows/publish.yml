name: Publish & Release Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Distribution tag (latest, beta, alpha, next, dry-run)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - alpha
          - latest
          - next
          - dry-run
      target:
        description: 'Publish target registry'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - github
          - npmjs

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x LTS (GitHub Packages Registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Yarn (Corepack)
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn --version

      - name: Resolve Release Version & Distribution Tag
        id: resolve-tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          
          IS_DRY_RUN=false
          DIST_TAG="latest"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_TAG="${{ inputs.tag }}"
            if [ "$SELECTED_TAG" = "dry-run" ]; then
              IS_DRY_RUN=true
              DIST_TAG="dry-run"
            else
              DIST_TAG="$SELECTED_TAG"
            fi
            RESOLVED_SOURCE="workflow_dispatch (input: $SELECTED_TAG)"
          elif [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            RESOLVED_SOURCE="github release tag ($RELEASE_TAG)"
            
            case "$RELEASE_TAG" in
              *-alpha*)
                DIST_TAG="alpha"
                ;;
              *-beta*)
                DIST_TAG="beta"
                ;;
              *-rc*|*-next*)
                DIST_TAG="next"
                ;;
              *)
                if [[ "$PACKAGE_VERSION" == *"-alpha"* ]]; then
                  DIST_TAG="alpha"
                elif [[ "$PACKAGE_VERSION" == *"-beta"* ]]; then
                  DIST_TAG="beta"
                elif [[ "$PACKAGE_VERSION" == *"-rc"* ]]; then
                  DIST_TAG="next"
                else
                  DIST_TAG="latest"
                fi
                ;;
            esac
          else
            RESOLVED_SOURCE="manual"
            DIST_TAG="latest"
          fi

          echo "DIST_TAG=$DIST_TAG" >> $GITHUB_ENV
          echo "IS_DRY_RUN=$IS_DRY_RUN" >> $GITHUB_ENV
          echo "RESOLVED_SOURCE=$RESOLVED_SOURCE" >> $GITHUB_ENV
          echo "Resolved Tag: $DIST_TAG (Dry-run: $IS_DRY_RUN, Source: $RESOLVED_SOURCE)"

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint & Test Suites
        run: |
          npm run lint
          npm test

      - name: Build Package Artifacts
        run: npm run build

      - name: Verify Package Outputs & Exports
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            
            if (pkg.name !== 'node-pptx-templater') throw new Error('Package name must be node-pptx-templater, found: ' + pkg.name);
            if (!fs.existsSync(pkg.main)) throw new Error('Missing pkg.main: ' + pkg.main);
            if (!fs.existsSync(pkg.module)) throw new Error('Missing pkg.module: ' + pkg.module);
            if (!fs.existsSync(pkg.types)) throw new Error('Missing pkg.types: ' + pkg.types);
            if (!fs.existsSync('./index.d.ts')) throw new Error('Missing root index.d.ts');
            if (!fs.existsSync('./dist/index.js')) throw new Error('Missing dist/index.js');
            if (!fs.existsSync('./dist/index.mjs')) throw new Error('Missing dist/index.mjs');
            console.log('✓ All package entry points, canonical name, and build outputs verified successfully.');
          "

      - name: Inspect Package Tarball (Dry-Run)
        run: npm pack --dry-run

      - name: Create Production Tarball for Multi-Manager Verification
        id: create-tarball
        run: |
          TARBALL_NAME=$(npm pack)
          echo "TARBALL_NAME=$TARBALL_NAME" >> $GITHUB_ENV
          echo "Created tarball: $TARBALL_NAME"

      - name: Multi-Package Manager Install & Consumption Verification
        run: |
          TARBALL_PATH="$(pwd)/$TARBALL_NAME"
          TEST_DIR=$(mktemp -d)
          echo "Verifying in temporary directory: $TEST_DIR"
          cd "$TEST_DIR"

          # 1. NPM Verification (canonical un-scoped package name)
          echo "=== Testing NPM ==="
          mkdir test-npm && cd test-npm
          npm init -y
          npm install "$TARBALL_PATH"
          node -e "const { PPTXTemplater } = require('node-pptx-templater'); if (typeof PPTXTemplater.load !== 'function') throw new Error('CJS import failed'); console.log('✓ npm CJS import verified');"
          node --input-type=module -e "import { PPTXTemplater } from 'node-pptx-templater'; if (typeof PPTXTemplater.load !== 'function') throw new Error('ESM import failed'); console.log('✓ npm ESM import verified');"
          cd ..

          # 2. PNPM Verification
          echo "=== Testing PNPM ==="
          mkdir test-pnpm && cd test-pnpm
          pnpm init
          pnpm add "$TARBALL_PATH"
          node -e "const { PPTXTemplater } = require('node-pptx-templater'); if (typeof PPTXTemplater.load !== 'function') throw new Error('CJS import failed'); console.log('✓ pnpm CJS import verified');"
          node --input-type=module -e "import { PPTXTemplater } from 'node-pptx-templater'; if (typeof PPTXTemplater.load !== 'function') throw new Error('ESM import failed'); console.log('✓ pnpm ESM import verified');"
          cd ..

          # 3. Yarn Verification (configured with node-modules linker for Yarn Berry)
          echo "=== Testing Yarn ==="
          mkdir test-yarn && cd test-yarn
          touch yarn.lock
          yarn init -y || true
          yarn config set nodeLinker node-modules || true
          yarn add "$TARBALL_PATH" || yarn add "node-pptx-templater@$TARBALL_PATH"
          node -e "const { PPTXTemplater } = require('node-pptx-templater'); if (typeof PPTXTemplater.load !== 'function') throw new Error('CJS import failed'); console.log('✓ yarn CJS import verified');"
          node --input-type=module -e "import { PPTXTemplater } from 'node-pptx-templater'; if (typeof PPTXTemplater.load !== 'function') throw new Error('ESM import failed'); console.log('✓ yarn ESM import verified');"
          cd ..

          # 4. Bun Verification
          echo "=== Testing Bun ==="
          mkdir test-bun && cd test-bun
          bun init -y
          bun add "$TARBALL_PATH"
          bun -e "import { PPTXTemplater } from 'node-pptx-templater'; if (typeof PPTXTemplater.load !== 'function') throw new Error('Bun import failed'); console.log('✓ bun ESM import verified');"
          cd ..

          echo "✓ All 4 package managers (npm, pnpm, yarn, bun) verified successfully!"

      - name: Publish to GitHub Packages
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'github'))
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Configuring package for GitHub Packages publishing..."
          cp package.json package.json.bak

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const owner = '${{ github.repository_owner }}'.toLowerCase();
            pkg.name = '@' + owner + '/node-pptx-templater';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Configured package for GitHub Packages:', pkg.name);
          "

          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "Executing GitHub Packages publish dry-run (tag: $DIST_TAG)..."
            npm publish --dry-run --registry=https://npm.pkg.github.com --tag "$DIST_TAG"
            GH_PUBLISH_RESULT="Dry Run Success (Not Published)"
          else
            echo "Publishing to GitHub Packages with dist-tag: $DIST_TAG..."
            npm publish --registry=https://npm.pkg.github.com --tag "$DIST_TAG"
            GH_PUBLISH_RESULT="Published to GitHub Packages (@${{ github.repository_owner }}/node-pptx-templater, tag '$DIST_TAG')"
          fi
          echo "GH_PUBLISH_RESULT=$GH_PUBLISH_RESULT" >> $GITHUB_ENV

          mv package.json.bak package.json

      - name: Publish to NPM Registry (Canonical 'node-pptx-templater')
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'npmjs'))
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] && [ "$IS_DRY_RUN" != "true" ]; then
            echo "NPM_TOKEN secret not set. Skipping npmjs registry publish."
            echo "NPM_PUBLISH_RESULT=Skipped (NPM_TOKEN not configured)" >> $GITHUB_ENV
          else
            if [ "$IS_DRY_RUN" = "true" ]; then
              echo "Executing npmjs publish dry-run (tag: $DIST_TAG)..."
              npm publish --dry-run --registry=https://registry.npmjs.org --tag "$DIST_TAG"
              NPM_PUBLISH_RESULT="Dry Run Success (Not Published)"
            else
              echo "Publishing canonical 'node-pptx-templater' to npmjs with dist-tag: $DIST_TAG..."
              npm publish --registry=https://registry.npmjs.org --tag "$DIST_TAG" --provenance || npm publish --registry=https://registry.npmjs.org --tag "$DIST_TAG"
              NPM_PUBLISH_RESULT="Published to npmjs (node-pptx-templater, tag '$DIST_TAG')"
            fi
            echo "NPM_PUBLISH_RESULT=$NPM_PUBLISH_RESULT" >> $GITHUB_ENV
          fi

      - name: Generate GitHub Release Step Summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 Publish & Release Pipeline Summary

          | Metric | Value |
          | :--- | :--- |
          | **Package Name** | `node-pptx-templater` |
          | **Package Version** | ${{ env.PACKAGE_VERSION }} |
          | **Trigger Event** | ${{ github.event_name }} |
          | **Tag Resolution Source** | ${{ env.RESOLVED_SOURCE }} |
          | **Resolved Dist-Tag** | `${{ env.DIST_TAG }}` |
          | **GitHub Packages Status** | ${{ env.GH_PUBLISH_RESULT || 'N/A' }} |
          | **NPM Registry Status** | ${{ env.NPM_PUBLISH_RESULT || 'N/A' }} |

          ### 📦 Verified Package Managers (Canonical 'node-pptx-templater')
          - [x] **npm** (v10+ / Node.js 22 LTS) — CJS & ESM loading verified
          - [x] **pnpm** (v9+) — Tarball resolution and CJS loading verified
          - [x] **yarn** (Corepack stable) — Tarball dependency installation verified
          - [x] **bun** (latest) — Native Bun runtime ESM import verified

          ### 🛡️ Pre-Publish Checks Passed
          - [x] Canonical package name verified (`node-pptx-templater`)
          - [x] Zero native binary dependencies (Pure JS boundary)
          - [x] Unit & Integration tests passing (`npm test`)
          - [x] Linting rules verified (`npm run lint`)
          - [x] Dual CJS/ESM & TypeScript typings validated
          - [x] Clean tarball content audit
          EOF
