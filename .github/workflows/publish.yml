name: Publish & Release Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Distribution tag (latest, beta, alpha, next, dry-run)'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - alpha
          - latest
          - next
          - dry-run
      target:
        description: 'Publish target registry'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - github
          - npmjs

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      is_dry_run: ${{ steps.resolve.outputs.is_dry_run }}
      tarball_name: ${{ steps.resolve.outputs.tarball_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Test Suites
        run: npm test

      - name: Build Package Artifacts
        run: npm run build

      - name: Verify Package Outputs & Exports
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            
            if (pkg.name !== 'node-pptx-templater') throw new Error('Package name must be node-pptx-templater, found: ' + pkg.name);
            if (!fs.existsSync(pkg.main)) throw new Error('Missing pkg.main: ' + pkg.main);
            if (!fs.existsSync(pkg.module)) throw new Error('Missing pkg.module: ' + pkg.module);
            if (!fs.existsSync(pkg.types)) throw new Error('Missing pkg.types: ' + pkg.types);
            if (!fs.existsSync('./index.d.ts')) throw new Error('Missing root index.d.ts');
            if (!fs.existsSync('./dist/index.js')) throw new Error('Missing dist/index.js');
            if (!fs.existsSync('./dist/index.mjs')) throw new Error('Missing dist/index.mjs');
            console.log('✓ All package entry points, canonical name, and build outputs verified successfully.');
          "

      - name: Resolve Release Version, Tag & Pack Tarball
        id: resolve
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TARBALL_NAME=$(npm pack)
          
          IS_DRY_RUN=false
          DIST_TAG="latest"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_TAG="${{ inputs.tag }}"
            if [ "$SELECTED_TAG" = "dry-run" ]; then
              IS_DRY_RUN=true
              DIST_TAG="dry-run"
            else
              DIST_TAG="$SELECTED_TAG"
            fi
            RESOLVED_SOURCE="workflow_dispatch (input: $SELECTED_TAG)"
          elif [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            RESOLVED_SOURCE="github release tag ($RELEASE_TAG)"
            
            case "$RELEASE_TAG" in
              *-alpha*)
                DIST_TAG="alpha"
                ;;
              *-beta*)
                DIST_TAG="beta"
                ;;
              *-rc*|*-next*)
                DIST_TAG="next"
                ;;
              *)
                if [[ "$PACKAGE_VERSION" == *"-alpha"* ]]; then
                  DIST_TAG="alpha"
                elif [[ "$PACKAGE_VERSION" == *"-beta"* ]]; then
                  DIST_TAG="beta"
                elif [[ "$PACKAGE_VERSION" == *"-rc"* ]]; then
                  DIST_TAG="next"
                else
                  DIST_TAG="latest"
                fi
                ;;
            esac
          else
            RESOLVED_SOURCE="manual"
            DIST_TAG="latest"
          fi

          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "dist_tag=$DIST_TAG" >> $GITHUB_OUTPUT
          echo "is_dry_run=$IS_DRY_RUN" >> $GITHUB_OUTPUT
          echo "tarball_name=$TARBALL_NAME" >> $GITHUB_OUTPUT
          echo "Resolved Tag: $DIST_TAG (Version: $PACKAGE_VERSION, Dry-run: $IS_DRY_RUN, Source: $RESOLVED_SOURCE)"

      - name: Upload Packaged Tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: node-pptx-templater-*.tgz
          if-no-files-found: error
          retention-days: 1

  verify-package-managers:
    name: Verify Package Managers (npm, pnpm, yarn, bun)
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node.js 22.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Yarn (Corepack)
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn --version

      - name: Download Packaged Tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball

      - name: Multi-Package Manager Install & Consumption Verification
        run: |
          TARBALL_PATH="$(pwd)/${{ needs.build-and-test.outputs.tarball_name }}"
          TEST_DIR=$(mktemp -d)
          echo "Verifying in temporary directory: $TEST_DIR"
          cd "$TEST_DIR"

          # 1. NPM Verification
          echo "=== Testing NPM ==="
          mkdir test-npm && cd test-npm
          npm init -y
          npm install "$TARBALL_PATH"
          node -e "const { PPTXTemplater } = require('node-pptx-templater'); if (typeof PPTXTemplater.load !== 'function') throw new Error('CJS import failed'); console.log('✓ npm CJS import verified');"
          node --input-type=module -e "import { PPTXTemplater } from 'node-pptx-templater'; if (typeof PPTXTemplater.load !== 'function') throw new Error('ESM import failed'); console.log('✓ npm ESM import verified');"
          cd ..

          # 2. PNPM Verification
          echo "=== Testing PNPM ==="
          mkdir test-pnpm && cd test-pnpm
          pnpm init
          pnpm add "$TARBALL_PATH"
          node -e "const { PPTXTemplater } = require('node-pptx-templater'); if (typeof PPTXTemplater.load !== 'function') throw new Error('CJS import failed'); console.log('✓ pnpm CJS import verified');"
          node --input-type=module -e "import { PPTXTemplater } from 'node-pptx-templater'; if (typeof PPTXTemplater.load !== 'function') throw new Error('ESM import failed'); console.log('✓ pnpm ESM import verified');"
          cd ..

          # 3. Yarn Verification (configured with node-modules linker for Yarn Berry)
          echo "=== Testing Yarn ==="
          mkdir test-yarn && cd test-yarn
          touch yarn.lock
          yarn init -y || true
          yarn config set nodeLinker node-modules || true
          yarn add "$TARBALL_PATH" || yarn add "node-pptx-templater@$TARBALL_PATH"
          node -e "const { PPTXTemplater } = require('node-pptx-templater'); if (typeof PPTXTemplater.load !== 'function') throw new Error('CJS import failed'); console.log('✓ yarn CJS import verified');"
          node --input-type=module -e "import { PPTXTemplater } from 'node-pptx-templater'; if (typeof PPTXTemplater.load !== 'function') throw new Error('ESM import failed'); console.log('✓ yarn ESM import verified');"
          cd ..

          # 4. Bun Verification
          echo "=== Testing Bun ==="
          mkdir test-bun && cd test-bun
          bun init -y
          bun add "$TARBALL_PATH"
          bun -e "import { PPTXTemplater } from 'node-pptx-templater'; if (typeof PPTXTemplater.load !== 'function') throw new Error('Bun import failed'); console.log('✓ bun ESM import verified');"
          cd ..

          echo "✓ All 4 package managers (npm, pnpm, yarn, bun) verified successfully!"

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'github'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x LTS (GitHub Packages Registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Download Packaged Tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball

      - name: Check GitHub Packages Existence & Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-and-test.outputs.version }}"
          DIST_TAG="${{ needs.build-and-test.outputs.dist_tag }}"
          IS_DRY_RUN="${{ needs.build-and-test.outputs.is_dry_run }}"
          OWNER="${{ github.repository_owner }}"
          SCOPED_NAME="@${OWNER,,}/node-pptx-templater"

          echo "Checking if $SCOPED_NAME@$VERSION is already published on GitHub Packages..."
          if npm view "$SCOPED_NAME@$VERSION" version --registry=https://npm.pkg.github.com/ > /dev/null 2>&1 || \
             npm view "node-pptx-templater@$VERSION" version --registry=https://npm.pkg.github.com/ > /dev/null 2>&1; then
            echo "::notice::Version $VERSION is already published to GitHub Packages. Skipping."
            echo "GH_PUBLISH_RESULT=Skipped (Version $VERSION already exists)" >> $GITHUB_ENV
            exit 0
          fi

          echo "Configuring package manifest for GitHub Packages..."
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const owner = '${{ github.repository_owner }}'.toLowerCase();
            pkg.name = '@' + owner + '/node-pptx-templater';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Configured package for GitHub Packages:', pkg.name);
          "

          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "Executing GitHub Packages publish dry-run (tag: $DIST_TAG)..."
            npm publish --dry-run --registry=https://npm.pkg.github.com/ --tag "$DIST_TAG"
            echo "GH_PUBLISH_RESULT=Dry Run Success (Not Published)" >> $GITHUB_ENV
          else
            echo "Publishing to GitHub Packages with dist-tag: $DIST_TAG..."
            npm publish --registry=https://npm.pkg.github.com/ --tag "$DIST_TAG"
            echo "GH_PUBLISH_RESULT=Published (@${{ github.repository_owner }}/node-pptx-templater, tag '$DIST_TAG')" >> $GITHUB_ENV
          fi

  publish-npm-registry:
    name: Publish to NPM Registry
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'npmjs'))
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x LTS (NPM Registry)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download Packaged Tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball

      - name: Check NPM Registry Existence & Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: |
          VERSION="${{ needs.build-and-test.outputs.version }}"
          DIST_TAG="${{ needs.build-and-test.outputs.dist_tag }}"
          IS_DRY_RUN="${{ needs.build-and-test.outputs.is_dry_run }}"

          echo "Checking if node-pptx-templater@$VERSION is already published on npm..."
          if npm view "node-pptx-templater@$VERSION" version --registry=https://registry.npmjs.org/ > /dev/null 2>&1; then
            echo "::notice::Version $VERSION is already published to npm. Skipping."
            echo "NPM_PUBLISH_RESULT=Skipped (Version $VERSION already exists)" >> $GITHUB_ENV
            exit 0
          fi

          if [ -z "$NODE_AUTH_TOKEN" ] && [ "$IS_DRY_RUN" != "true" ]; then
            echo "::warning::NPM_TOKEN secret not configured. Skipping npm publish."
            echo "NPM_PUBLISH_RESULT=Skipped (NPM_TOKEN not configured)" >> $GITHUB_ENV
            exit 0
          fi

          TARBALL_PATH=$(find . -maxdepth 1 -name "node-pptx-templater-*.tgz" | head -n 1)

          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "Executing npm publish dry-run (tag: $DIST_TAG)..."
            if [ -n "$TARBALL_PATH" ]; then
              npm publish "$TARBALL_PATH" --dry-run --tag "$DIST_TAG" --access public --registry=https://registry.npmjs.org/
            else
              npm publish --dry-run --tag "$DIST_TAG" --access public --registry=https://registry.npmjs.org/
            fi
            echo "NPM_PUBLISH_RESULT=Dry Run Success (Not Published)" >> $GITHUB_ENV
          else
            echo "Publishing canonical 'node-pptx-templater' to npm with dist-tag: $DIST_TAG..."
            if [ -n "$TARBALL_PATH" ]; then
              npm publish "$TARBALL_PATH" --tag "$DIST_TAG" --access public --registry=https://registry.npmjs.org/ --provenance || \
              npm publish "$TARBALL_PATH" --tag "$DIST_TAG" --access public --registry=https://registry.npmjs.org/
            else
              npm publish --tag "$DIST_TAG" --access public --registry=https://registry.npmjs.org/ --provenance || \
              npm publish --tag "$DIST_TAG" --access public --registry=https://registry.npmjs.org/
            fi
            echo "NPM_PUBLISH_RESULT=Published (node-pptx-templater, tag '$DIST_TAG')" >> $GITHUB_ENV
          fi
