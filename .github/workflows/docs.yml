name: Documentation Deployment (Cloudflare / Pages)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform'
        required: true
        default: 'cloudflare'
        type: choice
        options:
          - cloudflare
          - github-pages
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install docs-site dependencies
        run: npm --prefix docs-site ci || npm --prefix docs-site install

      - name: Build Next.js Documentation Site
        run: npm run docs:build

      - name: Deploy to Cloudflare Pages
        if: inputs.target == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying docs-site/out to Cloudflare Pages (${{ inputs.environment }})..."
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler pages deploy docs-site/out --project-name=node-pptx-templater --branch=${{ inputs.environment == 'production' && 'main' || 'preview' }}
          else
            echo "::notice::CLOUDFLARE_API_TOKEN not configured; verified static export build in docs-site/out."
          fi

      - name: Setup GitHub Pages
        if: inputs.target == 'github-pages'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: inputs.target == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out

      - name: Deploy to GitHub Pages
        if: inputs.target == 'github-pages'
        id: deployment
        uses: actions/deploy-pages@v4
